<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSM Tigersharks Swimming Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#003366;--navy-l:#004488;--g0:#f8f9fa;--g1:#e9ecef;--gd:#6c757d}
body{font-family:'Segoe UI',sans-serif;background:var(--navy);color:#333;min-height:100vh}

/* Sync toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#003366;color:#fff;padding:10px 22px;border-radius:30px;font-size:.84rem;box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:999;display:none;align-items:center;gap:9px;white-space:nowrap}
#toast.show{display:flex}
.tdot{width:8px;height:8px;background:#4caf50;border-radius:50%;animation:p 1.2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

/* Layout */
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.hdr{background:#fff;padding:24px 28px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);margin-bottom:22px}
.hdr-in{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.hdr img{height:76px;width:76px}
.hdr h1{color:var(--navy);font-size:1.85rem;margin-bottom:3px}
.hdr p{color:var(--gd);font-size:.95rem}
.lbadge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:.76rem;font-weight:700;margin-top:7px}
.lb-live{background:#e8f5e9;color:#2e7d32}
.lb-cache{background:#fff3e0;color:#e65100}
.ldot{width:7px;height:7px;border-radius:50%}
.ld-live{background:#4caf50}
.ld-cache{background:#ff9800}
.upd{font-size:.74rem;color:#aaa;margin-top:4px}

/* Controls */
.ctrl-bar{background:#fff;padding:18px 22px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);margin-bottom:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px}
.cf label{display:block;font-weight:600;color:var(--navy);font-size:.82rem;margin-bottom:5px}
.cf input,.cf select{width:100%;padding:9px 11px;border:2px solid var(--g1);border-radius:8px;font-size:.92rem;background:#fff;transition:border-color .18s}
.cf input:focus,.cf select:focus{outline:none;border-color:var(--navy)}
.cf button{width:100%;padding:9px 11px;background:var(--navy);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.92rem;font-weight:600;transition:all .18s}
.cf button:hover{background:var(--navy-l);transform:translateY(-1px)}

/* Tabs */
.tabs{display:flex;gap:7px;margin-bottom:22px;flex-wrap:wrap}
.tab{padding:9px 18px;background:#fff;border:2px solid var(--g1);border-radius:10px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--navy);transition:all .18s;white-space:nowrap}
.tab:hover{border-color:var(--navy)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Card */
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.28);margin-bottom:22px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.ct{font-size:1.4rem;font-weight:700;color:var(--navy)}
.badge{padding:5px 14px;background:var(--navy);color:#fff;border-radius:20px;font-weight:600;font-size:.82rem}
.sec{display:none}.sec.on{display:block}

/* Swimmer cards */
.sc{background:var(--g0);border:2px solid var(--g1);border-radius:11px;padding:16px;margin-bottom:13px;transition:all .18s}
.sc:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(0,51,102,.13);transform:translateY(-1px)}
.sch{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.sn{font-size:1.15rem;font-weight:700;color:var(--navy)}
.db{display:inline-block;padding:2px 9px;border-radius:9px;font-size:.68rem;font-weight:700;text-transform:uppercase;margin-left:7px}
.d-elem{background:#dbeafe;color:#1e40af}.d-sec{background:#fef3c7;color:#92400e}
.csc{background:#e0e7ff;color:#4338ca}.clc{background:#fed7aa;color:#9a3412}
.rbadge{display:inline-block;padding:2px 9px;background:#FFD700;color:var(--navy);border-radius:9px;font-size:.68rem;font-weight:700;margin-left:7px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.ss{text-align:center;padding:13px;border-radius:9px;background:var(--navy);color:#fff}
.sv{font-size:1.7rem;font-weight:700;margin-bottom:2px}
.sl{font-size:.77rem;opacity:.9}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:8px;margin-top:10px}
.ms{text-align:center;padding:10px;border-radius:8px;background:#fff;border:2px solid var(--g1)}
.mi{font-size:1.7rem;margin-bottom:4px}.mc{font-size:1.2rem;font-weight:700;color:var(--navy)}.ml{font-size:.68rem;color:var(--gd);margin-top:2px}

/* Relay */
.rteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:7px;margin-top:10px}
.rleg{padding:11px;background:#fff;border:2px solid var(--g1);border-radius:8px;text-align:center}
.rl-n{font-size:.68rem;color:#999;margin-bottom:3px}
.rl-name{font-weight:600;color:var(--navy);font-size:.88rem}
.rl-s{color:var(--gd);font-size:.77rem;font-weight:600;margin-top:2px}
.rl-t{color:var(--navy);font-weight:700;font-size:.82rem;margin-top:3px}
.rsec{margin-bottom:26px}
.rsec h2{color:var(--navy);margin-bottom:13px;padding-bottom:7px;border-bottom:3px solid var(--navy);font-size:1.15rem}

/* Table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;margin-top:13px;font-size:.88rem}
thead{background:var(--g0)}
th{padding:11px;text-align:left;font-weight:600;border-bottom:2px solid var(--g1);color:var(--navy);white-space:nowrap}
td{padding:11px;border-bottom:1px solid var(--g1)}
tr:hover{background:rgba(0,51,102,.04)}
.ip{display:inline-block;padding:2px 9px;background:#d1fae5;color:#065f46;border-radius:9px;font-size:.72rem;font-weight:600}
.in{display:inline-block;padding:2px 9px;background:#fee2e2;color:#991b1b;border-radius:9px;font-size:.72rem;font-weight:600}
.empty{text-align:center;padding:45px 20px;color:#999}
.ei{font-size:2.8rem;margin-bottom:13px}
#btt{position:fixed;bottom:20px;right:20px;width:44px;height:44px;background:var(--navy);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:1.2rem;display:none;box-shadow:0 4px 12px rgba(0,0,0,.28);z-index:100}
@media(max-width:700px){.hdr h1{font-size:1.3rem}.wrap{padding:10px}.card{padding:13px}th,td{padding:7px 9px;font-size:.8rem}.sv{font-size:1.3rem}}
</style>
</head>

let swimData=[],relData=[],filtered=[],curTab='swimmers';

/* ── Process ─────────────────────────────────────────────*/
function procI(rows){
  return rows.filter(r=>r.Swimmer&&(r.Swimmer+'').trim()).map(r=>{
    const dist=parseFloat(r['Distance (m)'])||null;
    const age=parseFloat(r.Age)||null;
    let div=r.Division||r.School_Division||'';
    if(!div&&age!==null)div=age<=12?'Elementary':'Secondary';
    let t=parseFloat(r.Time_Num)||null;
    if(!t){const raw=(r['Final Result (MM:SS.ss)']||'').toString().trim();
      if(raw&&!['DQ','NT','NS',''].includes(raw)){
        if(raw.includes(':')){const[m,s]=raw.split(':');t=+m*60+ +s;}else t=+raw||null;}}
    let pt=r.Participation||'';
    if(!pt)pt=['student','school','grade'].some(w=>(r.Competition_Name||'').toLowerCase().includes(w))?'School':'Club';
    return{...r,Swimmer:(r.Swimmer+'').trim(),Age:age,School_Division:div,Distance:dist,Time_Seconds:t,Participation:pt,
      Competition_Date:r.Competition_Date?new Date(r.Competition_Date):null};
  });
}
function procR(rows){
  return rows.filter(r=>r.Competition_Name&&(r.Competition_Name+'').trim()).map(r=>({
    ...r,Competition_Date:r.Competition_Date?new Date(r.Competition_Date):null}));
}

/* ── INIT: show embedded data immediately ──────────────── */
function init(){
  swimData=procI(EMB_I); relData=procR(EMB_R);
  filtered=[...swimData];
  buildFilters(); applyFilters();
  setLive(false,'Saved data — syncing…');
  // Sync from Sheets in background, no blocking
  setTimeout(bgSync,0);
}

/* ── Background sync ─────────────────────────────────────*/
async function bgSync(){
  const toast=document.getElementById('toast');
  try{
    toast.classList.add('show');
    const[iR,rR]=await Promise.all([fetch(csvURL('Individual_Results')),fetch(csvURL('Relay_Results'))]);
    if(!iR.ok||!rR.ok)throw new Error('not ok');
    const[iC,rC]=await Promise.all([iR.text(),rR.text()]);
    const ni=procI(Papa.parse(iC,{header:true,skipEmptyLines:true}).data);
    const nr=procR(Papa.parse(rC,{header:true,skipEmptyLines:true}).data);
    if(ni.length){
      swimData=ni; relData=nr; filtered=[...swimData];
      buildFilters(); applyFilters();
      setLive(true,'Live · Google Sheets · '+new Date().toLocaleTimeString());
      document.getElementById('tmsg').textContent='✓ Synced!';
      setTimeout(()=>toast.classList.remove('show'),2500);
    }
  }catch(e){
    toast.classList.remove('show');
    setLive(false,'Showing saved data (Sheets not reachable)');
  }
}

function setLive(live,msg){
  const b=document.getElementById('lbadge'),d=document.getElementById('ldot'),t=document.getElementById('ltxt'),u=document.getElementById('upd');
  b.className='lbadge '+(live?'lb-live':'lb-cache');
  d.className='ldot '+(live?'ld-live':'ld-cache');
  t.textContent=live?'LIVE':'Saved data';
  u.textContent=msg;
}

/* ── Filters ─────────────────────────────────────────────*/
function buildFilters(){
  const sf=document.getElementById('fSt'),df=document.getElementById('fDi');
  const sv=sf.value,dv=df.value;
  while(sf.options.length>1)sf.remove(1);
  while(df.options.length>1)df.remove(1);
  [...new Set(swimData.map(d=>d.Stroke).filter(Boolean))].sort()
    .forEach(s=>{const o=new Option(s,s);sf.add(o);});
  [...new Set(swimData.map(d=>d.Distance).filter(Boolean))].sort((a,b)=>a-b)
    .forEach(d=>{const o=new Option(d+'m',d);df.add(o);});
  if(sv)sf.value=sv; if(dv)df.value=dv;
}
function applyFilters(){
  const s=document.getElementById('fS').value.toLowerCase();
  const st=document.getElementById('fSt').value;
  const di=document.getElementById('fDi').value;
  const co=document.getElementById('fC').value;
  const dv=document.getElementById('fD').value;
  const pa=document.getElementById('fP').value;
  filtered=swimData.filter(r=>
    (!s||(r.Swimmer||'').toLowerCase().includes(s))&&
    (!st||r.Stroke===st)&&(!di||r.Distance==di)&&
    (!co||r.Course_Designation===co)&&(!dv||r.School_Division===dv)&&
    (!pa||r.Participation===pa));
  render();
}
['fSt','fDi','fC','fD','fP'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
document.getElementById('fS').addEventListener('input',applyFilters);

/* ── Tabs ────────────────────────────────────────────────*/
function sw(tab,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById(tab).classList.add('on');
  el.classList.add('on'); curTab=tab; render();
}
function render(){
  ({swimmers:rSwimmers,records:rRecords,agegroups:rAge,relaybuilder:rRelay,
    progress:rProgress,pbs:rPBs,medals:rMedals,relays:rRelays,comps:rComps})[curTab]();
}

/* ── Helpers ─────────────────────────────────────────────*/
const fd=d=>d?new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'N/A';
const ft=s=>{if(!s)return'N/A';const m=Math.floor(s/60);const sc=(s%60).toFixed(2);return m?`${m}:${sc.padStart(5,'0')}`:`${sc}s`};
const ab=s=>({'Breaststroke':'BR','Freestyle':'FR','Butterfly':'FL','Backstroke':'BK'}[s]||s);
const db=d=>d?`<span class="db d-${d==='Elementary'?'elem':'sec'}">${d}</span>`:'';
const em=(i,m)=>`<div class="empty"><div class="ei">${i}</div><p>${m}</p></div>`;

/* ── SWIMMERS ────────────────────────────────────────────*/
function rSwimmers(){
  const m={};
  filtered.forEach(r=>{
    if(!m[r.Swimmer])m[r.Swimmer]={div:r.School_Division,age:r.Age,races:0,g:0,s:0,b:0,ev:new Set()};
    const d=m[r.Swimmer];d.races++;d.ev.add(`${r.Distance}m ${r.Stroke}`);
    if(r.Medal==='Gold')d.g++;else if(r.Medal==='Silver')d.s++;else if(r.Medal==='Bronze')d.b++;
  });
  const ns=Object.keys(m).sort();
  document.getElementById('b-swimmers').textContent=ns.length+' Swimmer'+(ns.length!==1?'s':'');
  if(!ns.length){document.getElementById('c-swimmers').innerHTML=em('👤','No swimmers found');return;}
  document.getElementById('c-swimmers').innerHTML=ns.map(n=>{
    const d=m[n],tot=d.g+d.s+d.b;
    return`<div class="sc"><div class="sch"><div><div class="sn">${n}${db(d.div)}${d.age?`<span style="font-size:.82rem;color:#666;margin-left:7px">Age ${d.age}</span>`:''}</div></div></div>
    <div class="sg">
      <div class="ss"><div class="sv">${d.races}</div><div class="sl">Races</div></div>
      <div class="ss"><div class="sv">${d.ev.size}</div><div class="sl">Events</div></div>
      <div class="ss"><div class="sv">${tot}</div><div class="sl">Medals</div></div>
    </div>
    <div class="mg">
      <div class="ms"><div class="mi">🥇</div><div class="mc">${d.g}</div></div>
      <div class="ms"><div class="mi">🥈</div><div class="mc">${d.s}</div></div>
      <div class="ms"><div class="mi">🥉</div><div class="mc">${d.b}</div></div>
    </div></div>`;

}

/* ── RECORDS ─────────────────────────────────────────────*/
function rRecords(){
  const rec={};
  swimData.forEach(r=>{
    if(!r.Time_Seconds)return;
    const k=`${r.Distance}m ${r.Stroke} (${r.Course_Designation})`;
    if(!rec[k]||r.Time_Seconds<rec[k].Time_Seconds)rec[k]=r;
  });
  const s=Object.entries(rec).sort((a,b)=>a[1].Distance-b[1].Distance||(a[1].Stroke||'').localeCompare(b[1].Stroke||''));
  document.getElementById('b-records').textContent=s.length+' Record'+(s.length!==1?'s':'');
  if(!s.length){document.getElementById('c-records').innerHTML=em('🏆','No records found');return;}
  document.getElementById('c-records').innerHTML=`<div class="tw"><table><thead><tr><th>Event</th><th>Time</th><th>Swimmer</th><th>Division</th><th>Date</th><th>Competition</th></tr></thead><tbody>`+
    s.map(([ev,r])=>`<tr><td><strong>${ev}</strong><span class="rbadge">RECORD</span></td>
    <td><strong style="color:var(--navy)">${r['Final Result (MM:SS.ss)']||''}</strong></td>
    <td><strong>${r.Swimmer}</strong></td><td>${db(r.School_Division)}</td>
    <td>${fd(r.Competition_Date)}</td><td style="font-size:.82rem">${r.Competition_Name||''}</td></tr>`).join('')+
  `</tbody></table></div>`;
}

/* ── AGE GROUPS ──────────────────────────────────────────*/
function rAge(){
  const m={};
  filtered.forEach(r=>{
    if(!r.Age)return;
    if(!m[r.Age])m[r.Age]={sw:new Set(),races:0,g:0,s:0,b:0};
    const d=m[r.Age];d.sw.add(r.Swimmer);d.races++;

  });
  const ages=Object.keys(m).sort((a,b)=>a-b);
  document.getElementById('b-agegroups').textContent=ages.length+' Age Group'+(ages.length!==1?'s':'');
  if(!ages.length){document.getElementById('c-agegroups').innerHTML=em('📊','No age data');return;}
  document.getElementById('c-agegroups').innerHTML=ages.map(age=>{
    const d=m[age],tot=d.g+d.s+d.b,div=age<=12?'Elementary':'Secondary';
    return`<div class="sc"><div class="sch"><div><div class="sn">Age ${age}${db(div)}</div></div></div>
    <div class="sg">
      <div class="ss"><div class="sv">${d.sw.size}</div><div class="sl">Swimmers</div></div>
      <div class="ss"><div class="sv">${d.races}</div><div class="sl">Races</div></div>
      <div class="ss"><div class="sv">${tot}</div><div class="sl">Medals</div></div>
      <div class="ss"><div class="sv">${(d.races/d.sw.size).toFixed(1)}</div><div class="sl">Avg Races</div></div>
    </div>
    <div class="mg">
      <div class="ms"><div class="mi">🥇</div><div class="mc">${d.g}</div></div>
      <div class="ms"><div class="mi">🥈</div><div class="mc">${d.s}</div></div>
      <div class="ms"><div class="mi">🥉</div><div class="mc">${d.b}</div></div>
    </div></div>`;
  }).join('');
}

/* ── RELAY BUILDER ───────────────────────────────────────*/
function rRelay(){
  const divMap={};
  swimData.forEach(r=>{if(r.Swimmer&&r.School_Division)divMap[r.Swimmer]=r.School_Division;});
  function buildDiv(data,label){
    const best={};
    data.forEach(r=>{
      if(!r.Time_Seconds||!r.Swimmer)return;
      if(r.Distance!==50&&r.Distance!==100)return;
      const k=`${r.Stroke}_${r.Distance}`;
      if(!best[k])best[k]={};
      if(!best[k][r.Swimmer]||r.Time_Seconds<best[k][r.Swimmer].Time_Seconds)best[k][r.Swimmer]=r;
    });
    Object.keys(best).forEach(k=>{best[k]=Object.values(best[k]).sort((a,b)=>a.Time_Seconds-b.Time_Seconds);});
    const types=[
      {name:'4 × 50m Medley Relay',dist:50,med:true},
      {name:'4 × 100m Medley Relay',dist:100,med:true},
      {name:'4 × 50m Freestyle Relay',dist:50,med:false},
      {name:'4 × 100m Freestyle Relay',dist:100,med:false}
    ];
    let h=`<div class="rsec"><h2>${label}</h2>`;
    types.forEach(rt=>{
      const used=new Set(),team=[];
      if(rt.med){
        ['Backstroke','Breaststroke','Butterfly','Freestyle'].forEach(st=>{
          const c=best[`${st}_${rt.dist}`]||[];
          const p=c.find(x=>!used.has(x.Swimmer))||null;
          if(p)used.add(p.Swimmer);team.push({st,swimmer:p});
        });
      } else {
        const c=best[`Freestyle_${rt.dist}`]||[];
        for(let i=0;i<4;i++){const p=c.find(x=>!used.has(x.Swimmer))||null;if(p)used.add(p.Swimmer);team.push({st:'Freestyle',swimmer:p});}
      }
      const tot=team.reduce((s,l)=>s+(l.swimmer?.Time_Seconds||0),0);
      const full=team.every(l=>l.swimmer);
      h+=`<div class="sc"><div class="sch"><div class="sn">🏊 ${rt.name}</div>${full?`<div class="badge">Projected: ${ft(tot)}</div>`:''}</div>
      <div class="rteam">`+team.map((leg,i)=>`<div class="rleg">
        <div class="rl-n">Leg ${i+1}</div>
        <div class="rl-name">${leg.swimmer?leg.swimmer.Swimmer:'—'}</div>
        <div class="rl-s">${ab(leg.st)}</div>
        ${leg.swimmer?`<div class="rl-t">${leg.swimmer['Final Result (MM:SS.ss)']||''}</div>`:''}</div>`).join('')+
      `</div></div>`;
    });
    return h+'</div>';
  }
  const elem=filtered.filter(r=>r.Swimmer&&divMap[r.Swimmer]==='Elementary');
  const sec=filtered.filter(r=>r.Swimmer&&divMap[r.Swimmer]==='Secondary');
  let h=`<p style="color:#666;margin-bottom:18px">Best relay teams from individual times. Each swimmer appears once per relay.</p>`;
  if(elem.length)h+=buildDiv(elem,'Elementary Division');
  if(sec.length)h+=buildDiv(sec,'Secondary Division');
  if(!elem.length&&!sec.length)h=em('🤝','No data with current filters');
  document.getElementById('c-relaybuilder').innerHTML=h;
}

/* ── PROGRESS ────────────────────────────────────────────*/
function rProgress(){
  const m={};
  filtered.forEach(r=>{if(!m[r.Swimmer])m[r.Swimmer]={div:r.School_Division,races:[]};m[r.Swimmer].races.push(r);});
  const ns=Object.keys(m).sort();
  document.getElementById('b-progress').textContent=ns.length+' Swimmer'+(ns.length!==1?'s':'');
  if(!ns.length){document.getElementById('c-progress').innerHTML=em('📈','No data');return;}
  document.getElementById('c-progress').innerHTML=ns.map(n=>{
    const d=m[n];
    const ev={};
    d.races.forEach(r=>{const k=`${r.Distance}m ${r.Stroke} (${r.Course_Designation})`;if(!ev[k])ev[k]=[];ev[k].push(r);});
    let totI=0,cnt=0;
    Object.values(ev).forEach(rs=>{
      const srt=rs.filter(r=>r.Time_Seconds).sort((a,b)=>a.Competition_Date-b.Competition_Date);
      if(srt.length>=2){totI+=((srt[0].Time_Seconds-srt[srt.length-1].Time_Seconds)/srt[0].Time_Seconds)*100;cnt++;}
    });
    const avg=cnt>0?(totI/cnt).toFixed(1):0;
    const imp=avg>0?`<span class="ip">↓ ${avg}% faster</span>`:avg<0?`<span class="in">↑ ${Math.abs(avg)}% slower</span>`:'';
    return`<div class="sc"><div class="sch"><div><div class="sn">${n}${db(d.div)} ${imp}</div></div>
    <div class="badge">${d.races.length} Race${d.races.length!==1?'s':''}</div></div></div>`;
  }).join('');
}

/* ── PERSONAL BESTS ──────────────────────────────────────*/
function rPBs(){
  const m={};
  filtered.forEach(r=>{
    if(!m[r.Swimmer])m[r.Swimmer]={div:r.School_Division,ev:{}};
    const k=`${r.Distance}m ${r.Stroke}`;

  });

    const d=m[n];
    const evs=Object.entries(d.ev).sort((a,b)=>a[1].Distance-b[1].Distance||(a[1].Stroke||'').localeCompare(b[1].Stroke||''));
    return`<div class="sc"><div class="sch"><div><div class="sn">${n}${db(d.div)}</div></div>
    <div class="badge">${evs.length} Event${evs.length!==1?'s':''}</div></div>
    <div class="tw"><table><thead><tr><th>Event</th><th>Best Time</th><th>Course</th><th>Date</th></tr></thead><tbody>`+
    evs.map(([ev,r])=>`<tr><td><strong>${ev}</strong></td>
      <td><strong style="color:var(--navy)">${r['Final Result (MM:SS.ss)']||''}</strong></td>
      <td><span class="db ${r.Course_Designation==='SC'?'csc':'clc'}">${r.Course_Designation||''}</span></td>
      <td>${fd(r.Competition_Date)}</td></tr>`).join('')+
    `</tbody></table></div></div>`;
  }).join('');
}

/* ── MEDALS ──────────────────────────────────────────────*/
function rMedals(){
  const m={};
  filtered.forEach(r=>{
    if(!r.Medal)return;
    if(!m[r.Swimmer])m[r.Swimmer]={div:r.School_Division,g:0,s:0,b:0};
    if(r.Medal==='Gold')m[r.Swimmer].g++;else if(r.Medal==='Silver')m[r.Swimmer].s++;else if(r.Medal==='Bronze')m[r.Swimmer].b++;
  });
  const sorted=Object.entries(m).sort((a,b)=>(b[1].g*3+b[1].s*2+b[1].b)-(a[1].g*3+a[1].s*2+a[1].b));
  document.getElementById('b-medals').textContent=sorted.length+' Swimmer'+(sorted.length!==1?'s':'');
  if(!sorted.length){document.getElementById('c-medals').innerHTML=em('🥇','No medals');return;}
  document.getElementById('c-medals').innerHTML=sorted.map(([n,d])=>{
    const tot=d.g+d.s+d.b;
    return`<div class="sc"><div class="sch"><div><div class="sn">${n}${db(d.div)}</div></div><div class="badge">${tot} Total</div></div>
    <div class="mg">
      <div class="ms"><div class="mi">🥇</div><div class="mc">${d.g}</div><div class="ml">Gold</div></div>
      <div class="ms"><div class="mi">🥈</div><div class="mc">${d.s}</div><div class="ml">Silver</div></div>
      <div class="ms"><div class="mi">🥉</div><div class="mc">${d.b}</div><div class="ml">Bronze</div></div>
    </div></div>`;
  }).join('');
}

/* ── RELAYS ──────────────────────────────────────────────*/
function rRelays(){
  const sorted=[...relData].sort((a,b)=>b.Competition_Date-a.Competition_Date);

/* ── COMPETITIONS ────────────────────────────────────────*/

      <div class="ms"><div class="mi">🥉</div><div class="mc">${d.b}</div></div>
    </div></div>`;

/* ── EXPORT ──────────────────────────────────────────────*/
function exportCSV(){
  if(!filtered.length){alert('No data to export.');return;}
  const cols=['Swimmer','Competition_Name','Competition_Date','Competition_Venue','Participation','School_Division','Distance','Stroke','Course_Designation','Final Result (MM:SS.ss)','Rank','Medal'];
  let csv=cols.join(',')+'
';
  filtered.forEach(r=>{csv+=cols.map(c=>{const v=c==='Distance'?r.Distance:r[c];return typeof v==='string'?`"${v.replace(/"/g,'""')}"`:v??'';}).join(',')+'
';});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`tigersharks_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}
