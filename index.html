<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSM Tigersharks · Team Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0a2744;
  --teal:#0891b2;
  --teal-lt:#e0f2fe;
  --teal-mid:#bae6fd;
  --gold:#f59e0b;
  --gold-lt:#fef3c7;
  --white:#ffffff;
  --gray-50:#f8fafc;
  --gray-100:#f1f5f9;
  --gray-200:#e2e8f0;
  --gray-400:#94a3b8;
  --gray-600:#475569;
  --gray-800:#1e293b;
  --green:#16a34a;
  --green-lt:#dcfce7;
  --red:#dc2626;
  --red-lt:#fee2e2;
  --radius:12px;
  --shadow:0 2px 12px rgba(10,39,68,.10);
  --shadow-lg:0 8px 32px rgba(10,39,68,.16);
}
/* Progress chart container */
.event-chart canvas{display:block;width:100%!important}
body{font-family:'DM Sans',sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.5;min-height:100vh}

/* ── HEADER ─────────────────────────── */
.site-header{background:var(--navy);padding:0}
.header-inner{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;gap:16px}
.header-logo{width:60px;height:60px;flex-shrink:0}
.header-text h1{color:var(--white);font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.header-text p{color:var(--teal-mid);font-size:.85rem;margin-top:2px}
.header-status{margin-left:auto;text-align:right}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;background:rgba(255,255,255,.1);color:var(--white)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.status-dot.live{background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-sub{color:var(--teal-mid);font-size:.72rem;margin-top:4px;text-align:right}

/* ── SYNC TOAST ─────────────────────── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:30px;font-size:.82rem;box-shadow:var(--shadow-lg);z-index:999;display:none;align-items:center;gap:8px;white-space:nowrap}
#toast.show{display:flex}
.toast-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1s infinite}

/* ── MAIN LAYOUT ────────────────────── */
.site-main{max-width:1200px;margin:0 auto;padding:24px}

/* ── TABS ───────────────────────────── */
.tab-bar{display:flex;gap:4px;background:var(--white);border-radius:var(--radius);padding:5px;box-shadow:var(--shadow);margin-bottom:24px;flex-wrap:wrap}
.tab-btn{flex:1;min-width:120px;padding:10px 16px;border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;color:var(--gray-600);transition:all .18s;white-space:nowrap;text-align:center}
.tab-btn:hover{background:var(--gray-100);color:var(--navy)}
.tab-btn.active{background:var(--navy);color:var(--white);font-weight:600}

/* ── PANELS ─────────────────────────── */
.panel{display:none}.panel.active{display:block}

/* ── CARDS ──────────────────────────── */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:18px 22px 14px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:1.05rem;font-weight:700;color:var(--navy)}
.card-body{padding:20px 22px}

/* ── SEARCH / FILTERS ───────────────── */
.search-bar{position:relative}
.search-bar input{width:100%;padding:12px 16px 12px 42px;border:2px solid var(--gray-200);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;color:var(--gray-800);background:var(--white);transition:border-color .18s;outline:none}
.search-bar input:focus{border-color:var(--teal)}
.search-bar .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:1.1rem;pointer-events:none}
.filter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
select{width:100%;padding:9px 12px;border:2px solid var(--gray-200);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--gray-800);background:var(--white);cursor:pointer;outline:none;transition:border-color .18s}
select:focus{border-color:var(--teal)}


/* ── SWIMMER PROFILE CARD ───────────── */
.profile-hero{background:linear-gradient(135deg,var(--navy) 0%,#1a4a7a 100%);color:var(--white);padding:28px 28px 24px;border-radius:var(--radius) var(--radius) 0 0}
.profile-name{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.profile-meta{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.meta-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.15);color:var(--white)}
.profile-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;padding:20px 22px;background:var(--teal-lt)}
.stat-box{text-align:center;padding:12px;background:var(--white);border-radius:10px}
.stat-val{font-size:1.8rem;font-weight:700;color:var(--navy);line-height:1}
.stat-lbl{font-size:.72rem;color:var(--gray-600);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.medal-icons{font-size:1.3rem;letter-spacing:2px}

/* ── COMPETITION BLOCK ──────────────── */
.comp-block{margin-bottom:14px;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden}
.comp-block-head{padding:13px 16px;background:var(--gray-50);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;cursor:pointer;user-select:none}
.comp-block-head:hover{background:var(--teal-lt)}
.comp-block-name{font-weight:600;color:var(--navy);font-size:.92rem}
.comp-block-meta{font-size:.78rem;color:var(--gray-400);margin-top:2px}
.comp-block-body{padding:12px 16px;display:none}
.comp-block.open .comp-block-body{display:block}
.comp-toggle{color:var(--gray-400);font-size:.9rem;transition:transform .2s;flex-shrink:0}
.comp-block.open .comp-toggle{transform:rotate(180deg)}

/* ── EVENT ROWS ─────────────────────── */
.event-table{width:100%;border-collapse:collapse;font-size:.87rem}
.event-table th{padding:7px 10px;text-align:left;font-size:.72rem;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--gray-100)}
.event-table td{padding:9px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-800)}
.event-table tr:last-child td{border-bottom:none}
.event-table tr:hover td{background:var(--gray-50)}
.time-val{font-weight:600;color:var(--navy);font-size:.92rem}
.relay-row{background:var(--teal-lt)}
.relay-label{display:inline-block;padding:2px 8px;background:var(--teal);color:var(--white);border-radius:6px;font-size:.68rem;font-weight:700;margin-right:4px}

/* ── PB TABLE ───────────────────────── */
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding-top:4px}
.pb-card{padding:12px 14px;background:var(--teal-lt);border-radius:9px;border:1px solid var(--teal-mid)}
.pb-event{font-size:.76rem;color:var(--teal);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pb-time{font-size:1.15rem;font-weight:700;color:var(--navy)}
.pb-ctx{font-size:.74rem;color:var(--gray-600)}

/* ── SECTION LABELS ─────────────────── */
.section-label{font-size:.78rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 8px}

/* ── BADGES ─────────────────────────── */
.bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.74rem;font-weight:700}
.bdg-navy{background:var(--navy);color:var(--white)}
.bdg-gold{background:var(--gold-lt);color:#92400e}
.bdg-teal{background:var(--teal-lt);color:#0e7490}
.bdg-el{background:#dbeafe;color:#1e40af}
.bdg-se{background:var(--gold-lt);color:#92400e}
.bdg-sc{background:#f3e8ff;color:#6b21a8}
.bdg-lc{background:#fce7f3;color:#9d174d}
.medal-g{background:#fef9c3;color:#713f12}
.medal-s{background:#f1f5f9;color:#334155}
.medal-b{background:#fef3c7;color:#92400e}

/* ── GENERAL LIST CARDS ─────────────── */
.list-card{padding:15px 18px;border:1px solid var(--gray-200);border-radius:10px;margin-bottom:10px;transition:box-shadow .18s}
.list-card:hover{box-shadow:var(--shadow)}
.list-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list-card-title{font-weight:600;color:var(--navy);font-size:.97rem}
.list-card-sub{font-size:.8rem;color:var(--gray-400);margin-top:3px}

/* ── TABLE WRAPPER ──────────────────── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data-tbl{width:100%;border-collapse:collapse;font-size:.87rem}
.data-tbl th{padding:10px 12px;text-align:left;font-size:.73rem;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em;background:var(--gray-50);border-bottom:2px solid var(--gray-100)}
.data-tbl td{padding:11px 12px;border-bottom:1px solid var(--gray-100)}
.data-tbl tbody tr:hover td{background:var(--gray-50)}
.data-tbl tbody tr:last-child td{border:none}

/* ── EMPTY STATE ────────────────────── */
.empty{text-align:center;padding:52px 20px;color:var(--gray-400)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty p{font-size:.95rem}

/* ── COUNT BADGE ────────────────────── */
.count-pill{background:var(--gray-100);color:var(--gray-600);padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:600}

/* ── RESPONSIVE ─────────────────────── */
@media(max-width:768px){
  /* Header */
  .header-inner{padding:12px 14px;gap:10px}
  .header-text h1{font-size:1.05rem}
  .header-logo{width:48px;height:48px}
  .header-status{display:none}
  /* Main */
  .site-main{padding:12px}
  /* Tab bar - scrollable row on mobile */
  .tab-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:3px;padding:4px;scrollbar-width:none;border-radius:10px}
  .tab-bar::-webkit-scrollbar{display:none}
  .tab-btn{flex:none;min-width:auto;white-space:nowrap;padding:9px 14px;font-size:.82rem;border-radius:8px}
  /* Season bar */
  .season-inner{padding:6px 12px;gap:8px;flex-wrap:wrap}
  .season-btns{flex-wrap:wrap;gap:3px}
  .season-btn{padding:4px 10px;font-size:.75rem}
  /* Cards */
  .card-head{padding:13px 14px 10px}
  .card-body{padding:14px}
  .card-title{font-size:.95rem}
  /* Swimmer grid */
  .swimmer-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .sw-card{padding:11px 10px}
  .sw-card-name{font-size:.82rem}
  /* Profile */
  .profile-hero{padding:18px 16px 14px}
  .profile-name{font-size:1.15rem}
  .profile-stats{grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
  .stat-box{padding:9px}
  .stat-val{font-size:1.2rem}
  .stat-lbl{font-size:.62rem}
  .medal-icons{font-size:.9rem}
  /* PB grid */
  .pb-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .pb-time{font-size:1rem!important}
  /* Competition blocks */
  .comp-block-head{padding:11px 12px}
  .comp-block-name{font-size:.85rem}
  .comp-block-meta{font-size:.72rem}
  .comp-block-body{padding:10px 12px}
  /* Tables */
  .event-table{font-size:.78rem}
  .event-table th,.event-table td{padding:6px 7px}
  .data-tbl{font-size:.78rem}
  .data-tbl th,.data-tbl td{padding:7px 8px}
  /* Back button on profile */
  .list-card{padding:12px 14px}
}
@media(max-width:400px){
  .tab-btn{padding:8px 11px;font-size:.78rem}
  .profile-stats{grid-template-columns:repeat(2,1fr)}
  .pb-grid{grid-template-columns:1fr 1fr}
}

/* ── SEASON SELECTOR ─────────────────── */
.season-bar{background:var(--navy);border-bottom:1px solid rgba(255,255,255,.1)}
.season-inner{max-width:1200px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.season-label{color:var(--teal-mid);font-size:.8rem;font-weight:600;white-space:nowrap}
.season-btns{display:flex;gap:4px}
.season-btn{padding:5px 14px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:transparent;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .18s}
.season-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.season-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.season-note{color:var(--teal-mid);font-size:.75rem;margin-left:auto}

/* ── SWIMMER GRID ────────────────────── */
.swimmer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.sw-card{padding:14px 12px;background:var(--gray-50);border:2px solid var(--gray-200);border-radius:10px;cursor:pointer;transition:all .18s;text-align:center}
.sw-card:hover{border-color:var(--teal);background:var(--teal-lt);transform:translateY(-2px);box-shadow:var(--shadow)}
.sw-card-name{font-weight:600;color:var(--navy);font-size:.88rem;line-height:1.3}
.sw-card-meta{font-size:.74rem;color:var(--gray-400);margin-top:4px}
.sw-card-medals{font-size:.9rem;margin-top:5px;letter-spacing:1px}
.sw-card-div{display:inline-block;padding:2px 7px;border-radius:8px;font-size:.65rem;font-weight:700;margin-top:5px}
</style>
</head>

let ALL=[], REL=[], DB=[], tab='swimmers', season='2026-2027';

// Season date ranges
const SEASONS = {
  '2026-2027': { start: new Date('2026-04-01'), end: new Date('2027-05-31') },
  'all':       { start: new Date('2000-01-01'), end: new Date('2099-12-31') },
};
function inSeason(date, s) {
  if (!date) return false;
  const d = new Date(date);
  const r = SEASONS[s];
  return d >= r.start && d <= r.end;
}

// Returns data filtered by current season (ALL data for records)
function seasonData(useAll) {
  if (useAll || season === 'all') return ALL;
  return ALL.filter(r => inSeason(r.date, season));
}
function seasonRelays(useAll) {
  if (useAll || season === 'all') return REL;
  return REL.filter(r => inSeason(r.date, season));
}

function setSeason(s, el) {
  season = s;
  document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  // Rebuild swimmer dropdown and re-render current tab
  buildSwimmerDropdown();
  render();
}

// ── DATA PROCESSING ────────────────────────────────────────
function procI(rows) {
  return rows.filter(r => r && r['Swimmer'] && String(r['Swimmer']).trim() && String(r['Swimmer']) !== 'null').map(r => {
    const dist = parseFloat(r['Distance (m)']) || null;
    const age  = parseFloat(r['Age']) || null;
    let div = r['School_Division'] || '';
    if (!div || div==='null' || div==='undefined') div = (age && age<=12)?'Elementary':'Secondary';
    // Fixed_Time_2 (col V) is the canonical time field
    let t = null;
    const ft2 = String(r['Fixed_Time_2'] || '').trim();
    if (ft2 && !['DQ','NT','NS',''].includes(ft2)) {
      try { t = ft2.includes(':') ? parseFloat(ft2.split(':')[0])*60+parseFloat(ft2.split(':')[1]) : parseFloat(ft2)||null; } catch(e) {}
    }
    if (!t) t = parseFloat(r['Time_Num']) || null;
    if (!t) {
      const raw = String(r['Final Result (MM:SS.ss)'] || '').trim();
      if (raw && !['DQ','NT','NS',''].includes(raw)) {
        try { t = raw.includes(':') ? parseFloat(raw.split(':')[0])*60+parseFloat(raw.split(':')[1]) : parseFloat(raw)||null; } catch(e) {}
      }
    }
    // Use Fixed_Time_2 as display string if available
    const time_display = (ft2 && !['DQ','NT','NS',''].includes(ft2)) ? ft2 : (r['Final Result (MM:SS.ss)']||'');
    let pt = r['Participation'] || '';
    if (!pt) pt = ['student','school','grade'].some(w=>String(r['Competition_Name']||'').toLowerCase().includes(w))?'School':'Club';
    let dt = null;
    try { dt = r['Competition_Date'] ? new Date(r['Competition_Date']) : null; } catch(e) {}
    return {
      name:String(r['Swimmer']).trim(), comp:r['Competition_Name']||'', date:dt,
      venue:r['Competition_Venue']||'', course:r['Course_Designation']||'', part:pt, div,
      age, rank:r['Rank'], medal:r['Medal']||'', dist, stroke:r['Stroke']||'',
      time_str:time_display, time_sec:t
    };
  });
}
// Normalize relay times: handles "00:03:34.210000" → "03:34.21" and "03:34.21" → "03:34.21"
function fmtRelayTime(raw) {
  if (!raw || typeof raw !== 'string') return raw || '';
  raw = raw.trim();
  if (!raw) return '';
  // If format is HH:MM:SS.ffffff (length > 8 with 3 colons or leading 00:)
  const parts = raw.split(':');
  if (parts.length === 3) {
    // HH:MM:SS.ffffff → strip hours, keep MM:SS.ss
    const mm = String(parseInt(parts[1],10)||0).padStart(2,'0');
    const ss = parseFloat(parts[2]).toFixed(2).padStart(5, '0');
    return `${mm}:${ss}`;
  }
  // Already MM:SS.ss — normalize decimals and pad minutes
  if (parts.length === 2) {
    if (isNaN(parseFloat(parts[1]))) return raw;   // e.g. "DQ"
    const mm = String(parseInt(parts[0],10)||0).padStart(2,'0');
    const ss = parseFloat(parts[1]).toFixed(2).padStart(5, '0');
    return `${mm}:${ss}`;
  }
  return raw;
}

function procR(rows) {
  return rows.filter(r=>r&&r['Competition_Name']&&String(r['Competition_Name']).trim()).map(r=>{
    let dt=null; try{dt=r['Competition_Date']?new Date(r['Competition_Date']):null;}catch(e){}
    return {
      comp:r['Competition_Name']||'', date:dt, venue:r['Competition_Venue']||'',
      course:r['Course_Designation']||'', event:r['Event']||'', rank:r['Rank'],
      medal:r['Medal']||'', time:fmtRelayTime(r['Team Time (MM:SS.ss)']||''), part:r['Participation']||'',
      m1:r['Relay Member 1']||'',m2:r['Relay Member 2']||'',m3:r['Relay Member 3']||'',m4:r['Relay Member 4']||'',
      s1:r['Stroke 1']||'',s2:r['Stroke 2']||'',s3:r['Stroke 3']||'',s4:r['Stroke 4']||'',
      sp1:r['Split Time 1'],sp2:r['Split Time 2'],sp3:r['Split Time 3'],sp4:r['Split Time 4'],
    };
  });
}
function procDB(rows) {
  return rows.filter(r=>r&&r['Full_Name']&&String(r['Full_Name']).trim()).map(r=>{
    return {name:String(r['Full_Name']).trim(),age:parseFloat(r['Age_Current'])||parseFloat(r['Age_EOY'])||null,grade:r['Grade_Level']||r['Grade_Current']||'',div:r['School_Division']||r['Division']||''};
  });
}

const STD_LEVELS = ['AAAA','AAA','AA','A','BBBB','BBB','BB','B','CCCC','CCC','CC','C'];
const STD_LEVEL_COLORS = {
  'AAAA':'#B45309,#FEF3C7','AAA':'#B45309,#FDE68A','AA':'#92400E,#FCD34D',
  'A':'#92400E,#FDE68A','BBBB':'#065F46,#D1FAE5','BBB':'#065F46,#A7F3D0',
  'BB':'#1E40AF,#BFDBFE','B':'#1E40AF,#DBEAFE','CCCC':'#5B21B6,#EDE9FE',
  'CCC':'#5B21B6,#F5F3FF','CC':'#6B21A8,#FAF5FF','C':'#374151,#F9FAFB'
};
const STROKE_TO_EV = {
  'Freestyle':'FR','Backstroke':'BK','Breaststroke':'BR',
  'Butterfly':'BU','Individual Medley':'IM','Medley':'IM','IM':'IM',
  'Individual Medley (IM)':'IM'
};
function ageToGroup(age) {
  if(!age||isNaN(age)) return null;
  const a=Math.floor(age);
  if(a>=19) return '19&Over';
  if(a>=6) return String(a);
  return null;
}
function getStdLevel(timeSec, isBoy, age, stroke, dist) {
  if(!timeSec||!stroke||!dist) return null;
  const prefix=STROKE_TO_EV[stroke];
  if(!prefix) return null;
  const evKey=dist+prefix;
  const ag=ageToGroup(age);
  if(!ag) return null;
  const gKey=isBoy?'Boys':'Girls';
  const byAge=TIME_STANDARDS[gKey]?.[ag];
  if(!byAge) return null;
  for(const lv of STD_LEVELS){
    const std=byAge[lv]?.[evKey];
    if(std&&timeSec<=std) return lv;
  }
  return null;
}
function levelBadge(lv) {
  if(!lv) return '';
  const [fg,bg]=(STD_LEVEL_COLORS[lv]||'#374151,#F3F4F6').split(',');
  return `<span style="display:inline-block;padding:1px 7px;border-radius:6px;font-size:.68rem;font-weight:800;background:${bg};color:${fg};letter-spacing:.04em;margin-left:4px;vertical-align:middle">${lv}</span>`;
}

// ── INIT ───────────────────────────────────────────────────
// ── NAME MATCHING (relay members vs swimmer roster) ────────────────────────
// Relay sheets spell names inconsistently ("Villarosa, Inigo Alfonso" vs
// "Villarosa, Inigo Alfonso"), which broke exact-match medal counting.
function normName(s){
  s = String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s.replace(/\s+/g,' ').trim().toLowerCase();
}
function nameParts(s){
  const n = normName(s);
  let sur, giv;
  const ci = n.indexOf(',');
  if (ci >= 0) { sur = n.slice(0,ci).trim(); giv = n.slice(ci+1).trim(); }
  else { const t = n.split(' ').filter(Boolean); sur = t.length?t[t.length-1]:''; giv = t.slice(0,-1).join(' '); }
  return { sur, giv: new Set(giv.split(' ').filter(Boolean)) };
}
let dataLoaded = false;   // false until the first successful sync
let syncFailed = false;
function loadingBox(msg){
  return '<div class="empty"><div class="empty-icon">⏳</div><p>'+(msg||'Loading results from Google Sheets…')+'</p></div>';
}
function errorBox(){
  return '<div class="empty"><div class="empty-icon">⚠️</div>'
    +'<p>Couldn\'t load results from Google Sheets.</p>'
    +'<button onclick="bgSync(1)" style="margin-top:12px;padding:9px 18px;border:none;border-radius:8px;'
    +'background:var(--navy);color:#fff;font-family:\'DM Sans\',sans-serif;font-size:.88rem;'
    +'font-weight:600;cursor:pointer">Retry</button></div>';
}
let _nameIdx = null;
function buildNameIndex(){
  // Resolution TARGETS are roster names only. Previously race names were also
  // targets, so a misspelling matched itself and never reached the roster
  // (e.g. "Alesna, Ken Frey Clan" never resolved to "...Cian").
  const roster = ((DB && DB.length) ? DB.map(d=>d.name) : EMB_DB.map(d=>d.Full_Name)).filter(Boolean);
  const exact = {};
  roster.forEach(n=>{ exact[normName(n)] = n; });
  _nameIdx = { roster, exact, rosterParts: roster.map(n=>({name:n, p:nameParts(n)})) };
}
function resolveName(raw){
  const s = String(raw==null?'':raw).trim();
  if(!s || ['nan','none','null','-'].includes(s.toLowerCase())) return '';
  if(!_nameIdx) buildNameIndex();
  const k = normName(s);
  if(_nameIdx.exact[k]) return _nameIdx.exact[k];          // accent/case variants
  // Same surname + at least one shared given name, matched against the roster.
  const p = nameParts(s);
  const cands = _nameIdx.rosterParts.filter(o=>{
    if(o.p.sur !== p.sur) return false;
    for(const g of p.giv) if(o.p.giv.has(g)) return true;
    return false;
  });
  if(cands.length === 1) return cands[0].name;
  return s;                                                 // alumni keep their own name
}
// Rewrite EVERY swimmer name (individual races AND relay legs) to one
// canonical roster spelling. Previously only relay legs were canonicalized,
// so a sheet spelling like "Inigo" vs roster "Iñigo" silently detached a
// swimmer from all of their individual swims.
function canonicalizeRelayNames(){
  buildNameIndex();
  ALL.forEach(r=>{ r.name = resolveName(r.name) || r.name; });
  REL.forEach(r=>{
    r.m1=resolveName(r.m1); r.m2=resolveName(r.m2);
    r.m3=resolveName(r.m3); r.m4=resolveName(r.m4);
  });
  _nameIdx = null;          // rebuild next time; names have changed
  refreshRosterSet();
}

// ── ROSTER GATE ───────────────────────────────────────────────────────────
// The roster is whatever LSM_Tigersharks_Official_Database contains (synced),
// falling back to the embedded copy before/if sync completes. Nobody outside
// this list is ever shown anywhere in the dashboard.
function ROSTER_LIST(){
  const src = (DB && DB.length) ? DB.map(d=>d.name) : EMB_DB.map(d=>d.Full_Name);
  return [...new Set(src.filter(Boolean))].sort();
}
let _rosterSet = null;
function refreshRosterSet(){ _rosterSet = new Set(ROSTER_LIST()); }
function onRoster(n){ if(!_rosterSet) refreshRosterSet(); return _rosterSet.has(n); }

function init() {
  // Warn if opened from file:// (sync won't work)
  if (location.protocol === 'file:') {
    const warn = document.createElement('div');
    warn.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;text-align:center;padding:10px 16px;font-size:.88rem;font-weight:600;z-index:9999';
    warn.textContent = '⚠️ Open this page from GitHub Pages, not from your Downloads folder. Sync won\'t work from file://.';
    document.body.prepend(warn);
  }
  ALL = []; REL = []; DB = procDB(EMB_DB);
  dataLoaded = false;
  buildNameIndex(); refreshRosterSet();
  buildSwimmerDropdown();
  render();
  setStatus(false,'Loading from Google Sheets…');
  setTimeout(bgSync, 0);
  setTimeout(initProgSearch, 100);
}

// ── BACKGROUND SYNC ────────────────────────────────────────
async function bgSync(attempt) {
  attempt = attempt || 1;
  const toast=document.getElementById('toast'), tmsg=document.getElementById('tmsg');
  // Abort so a hung request can never leave the page spinning forever
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  const get = async (url) => {
    const res = await fetch(url, {signal: ctrl.signal, cache:'default'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.text();
  };
  try {
    toast.classList.add('show');
    tmsg.textContent = attempt>1 ? 'Retrying sync…' : 'Syncing with Google Sheets…';

    // Individual results are required; relays are optional so one bad sheet
    // can't wipe out the other.
    const [iRes, rRes] = await Promise.allSettled([get(URL_I), get(URL_R)]);
    clearTimeout(timer);
    if(iRes.status !== 'fulfilled') throw iRes.reason || new Error('individual fetch failed');

    const nI = procI(Papa.parse(iRes.value,{header:true,skipEmptyLines:true}).data);
    if(!nI.length) throw new Error('individual sheet parsed empty');

    let nR = null;
    if(rRes.status === 'fulfilled'){
      try {
        const parsed = procR(Papa.parse(rRes.value,{header:true,skipEmptyLines:true}).data);
        if(parsed.length) nR = parsed;
      } catch(err){ console.warn('Relay parse failed, keeping previous relays:', err.message); }
    } else {
      console.warn('Relay fetch failed, keeping previous relays:', rRes.reason && rRes.reason.message);
    }

    ALL = nI;
    if(nR) REL = nR;
    dataLoaded = true; syncFailed = false;
    canonicalizeRelayNames();
    buildSwimmerDropdown();
    render();

    const partial = !nR;
    setStatus(true,'LIVE · Synced · '+new Date().toLocaleTimeString());
    tmsg.textContent = partial ? '✓ Synced (relays from saved data)' : '✓ Synced with Google Sheets';
    setTimeout(()=>toast.classList.remove('show'),2500);
  } catch(e) {
    clearTimeout(timer);
    console.warn('Sync failed (attempt '+attempt+'):', e.message);
    if(attempt < 2){
      tmsg.textContent='Sync failed — retrying…';
      setTimeout(()=>bgSync(attempt+1), 2500);
      return;
    }
    toast.classList.remove('show');
    syncFailed = true;
    setStatus(false,'Could not load — tap Retry');
    buildSwimmerDropdown();
    render();
  }
}

function setStatus(live,msg) {
  const dot=document.getElementById('sdot'),txt=document.getElementById('stxt'),sub=document.getElementById('ssub');
  dot.className='status-dot'+(live?' live':'');
  txt.textContent=live?'Live':'Saved Data';
  sub.textContent=msg;
}

// ── HELPERS ────────────────────────────────────────────────
const fd = d => d ? new Date(d).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '';
const ft = s => { if(!s) return '—'; const m=Math.floor(s/60),sc=(s%60).toFixed(2); return m?`${m}:${sc.padStart(5,'0')}`:`${sc}s`; };
const ab = s => ({'Breaststroke':'Breast','Freestyle':'Free','Butterfly':'Fly','Backstroke':'Back'}[s]||s||'');
const dbMap = () => {
  const m={};
  // Seed from EMB_DB first (always available, has Full_Name key)
  EMB_DB.forEach(d=>{ m[d.Full_Name]={name:d.Full_Name,age:d.Age_Current,grade:d.Grade_Level||'',div:d.School_Division||d.Division||''}; });
  // Overwrite with synced DB data (richer, has age/grade/div from Sheets)
  DB.forEach(d=>{m[d.name]=d;});
  return m;
};
const medalEmoji = m => m==='Gold'?'🥇':m==='Silver'?'🥈':m==='Bronze'?'🥉':'';
const courseBdg = c => `<span class="bdg ${c==='SC'||c==='Short Course'?'bdg-sc':'bdg-lc'}">${c}</span>`;
const divBdg = d => d?`<span class="bdg ${d==='Elementary'?'bdg-el':'bdg-se'}">${d}</span>`:'';
const medalBdg = m => m?`<span class="bdg ${m==='Gold'?'medal-g':m==='Silver'?'medal-s':'medal-b'}">${medalEmoji(m)} ${m}</span>`:'';

// ── SWIMMER DROPDOWN ───────────────────────────────────────
function buildSwimmerDropdown() {
  // ONLY the current roster is ever displayed, in every season view.
  const rosterNames = ROSTER_LIST();
  document.getElementById('cnt-swimmers').textContent =
    rosterNames.length+' Swimmer'+(rosterNames.length!==1?'s':'');
  window._swimmerNames = rosterNames;
  renderSwimmerGrid(rosterNames);
}

function renderSwimmerGrid(names) {
  const db = dbMap();
  const grid = document.getElementById('sw-grid');
  if (!names.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>No swimmers match your search.</p></div>';
    return;
  }
  // Index races by name ONCE. Previously this called seasonData() inside the
  // loop, rescanning every race for every swimmer (O(swimmers x races)).
  const seasonBy = {}, allBy = {}, relBy = {};
  seasonData().forEach(r=>{ (seasonBy[r.name] || (seasonBy[r.name]=[])).push(r); });
  ALL.forEach(r=>{ (allBy[r.name] || (allBy[r.name]=[])).push(r); });
  seasonRelays().forEach(r=>{
    [r.m1,r.m2,r.m3,r.m4].filter(Boolean).forEach(n=>{ (relBy[n] || (relBy[n]=[])).push(r); });
  });
  grid.innerHTML = names.map(n => {
    const info = db[n] || {};
    const racesSeason = seasonBy[n] || [];
    const racesAll = allBy[n] || [];
    const myRel = relBy[n] || [];
    const g = racesSeason.filter(r=>r.medal==='Gold').length   + myRel.filter(r=>r.medal==='Gold').length;
    const s = racesSeason.filter(r=>r.medal==='Silver').length + myRel.filter(r=>r.medal==='Silver').length;
    const b = racesSeason.filter(r=>r.medal==='Bronze').length + myRel.filter(r=>r.medal==='Bronze').length;
    const medals = (g?'🥇'.repeat(Math.min(g,3)):'')+(s?'🥈'.repeat(Math.min(s,3)):'')+(b?'🥉'.repeat(Math.min(b,3)):'');
    const div = info.div || racesAll[0]?.div || '';
    const divClass = div==='Elementary'?'bdg-el':'bdg-se';
    return `<div class="sw-card" onclick="showSwimmer('${n.replace(/'/g,"\'")}')">
      <div class="sw-card-name">${n}</div>
      ${div?`<div class="sw-card-div ${divClass}">${div}</div>`:''}
      <div class="sw-card-meta">${!dataLoaded ? (syncFailed?'—':'loading…') : (racesSeason.length+' swim'+(racesSeason.length!==1?'s':'')+((relBy[n]||[]).length?' · '+relBy[n].length+' relay'+(relBy[n].length!==1?'s':''):''))}</div>
      ${medals?`<div class="sw-card-medals">${medals}</div>`:''}
    </div>`;
  }).join('');
}

function filterSwimmerGrid(q) {
  const names = (window._swimmerNames||[]).filter(n=>n.toLowerCase().includes(q.toLowerCase()));
  renderSwimmerGrid(names);
}

    document.getElementById('swimmer-picker-card').style.display='none';
    document.getElementById('sw-profile-wrap').style.display='block';
    document.getElementById('sw-profile-crumb').textContent=name;
    el.innerHTML = syncFailed?errorBox():loadingBox(); return; }

  const _sr = seasonRelays(); const myRelays = _sr.filter(r=>[r.m1,r.m2,r.m3,r.m4].includes(name));
  const relMedals = myRelays.filter(r=>r.medal);
  const gold   = medals.filter(r=>r.medal==='Gold').length   + relMedals.filter(r=>r.medal==='Gold').length;
  const silver = medals.filter(r=>r.medal==='Silver').length + relMedals.filter(r=>r.medal==='Silver').length;
  const bronze = medals.filter(r=>r.medal==='Bronze').length + relMedals.filter(r=>r.medal==='Bronze').length;
  const div = info.div || races[0]?.div || '';
  
  // Relay appearances for this swimmer (already declared above)
  
  // Personal bests use ALL data (not season-filtered) so nothing is missed
  const allRaces = ALL.filter(r=>r.name===name);
  const pbMap = {};
  allRaces.forEach(r=>{
    if(!r.time_sec||!r.dist||!r.stroke) return;
    const k=`${r.dist}m ${r.stroke} (${r.course})`;
    if(!pbMap[k]||r.time_sec<pbMap[k].time_sec) pbMap[k]=r;
  });
  const pbs = Object.entries(pbMap).sort((a,b)=>a[1].dist-b[1].dist||a[1].stroke.localeCompare(b[1].stroke));
  
  // Group relays by competition
  const relByComp = {};

    relByComp[r.comp].rows.push(r);
  });

  // Group individual races by competition
  const byComp = {};
  races.forEach(r=>{
    if(!byComp[r.comp]) byComp[r.comp]={date:r.date,venue:r.venue,course:r.course,part:r.part,rows:[]};
    byComp[r.comp].rows.push(r);
  });
  // Include meets where this swimmer ONLY swam a relay, otherwise those
  // relays (and their medals) never get rendered.
  myRelays.forEach(r=>{
    if(!byComp[r.comp]) byComp[r.comp]={date:r.date,venue:r.venue,course:r.course,part:r.part||'',rows:[]};
  });
  const comps = Object.entries(byComp).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date));

  el.innerHTML = `
    <div class="profile-hero">
      <div class="profile-name">${name}</div>
      <div class="profile-meta">
        ${divBdg(div)}
        ${info.age?`<span class="meta-chip">Age ${info.age}</span>`:(races[0]?.age?`<span class="meta-chip">Age ${races[0].age}</span>`:'' )}
        ${info.grade?`<span class="meta-chip">${info.grade}</span>`:''}
      </div>
    </div>
    <div class="profile-stats">
      <div class="stat-box"><div class="stat-val">${races.length||'—'}</div><div class="stat-lbl">Swims</div></div>
      <div class="stat-box"><div class="stat-val">${myRelays.length}</div><div class="stat-lbl">Relays</div></div>
      <div class="stat-box"><div class="stat-val">${comps.length}</div><div class="stat-lbl">Meets</div></div>
      <div class="stat-box"><div class="stat-val">${pbs.length}</div><div class="stat-lbl">Events</div></div>
      <div class="stat-box">
        <div class="stat-val medal-icons">${'🥇'.repeat(gold)||'—'}</div>
        <div class="stat-lbl">${gold} Gold</div>
      </div>
      <div class="stat-box">
        <div class="stat-val medal-icons">${'🥈'.repeat(silver)||'—'}</div>
        <div class="stat-lbl">${silver} Silver</div>
      </div>
      <div class="stat-box">
        <div class="stat-val medal-icons">${'🥉'.repeat(bronze)||'—'}</div>
        <div class="stat-lbl">${bronze} Bronze</div>
      </div>
    </div>

    <!-- Personal Bests -->
    <div style="padding:20px 22px;border-bottom:1px solid var(--gray-100)">
      <div class="section-label">🌟 Personal Bests</div>
      ${(()=>{
        const sc=pbs.filter(([,r])=>r.course==='SC'||r.course==='Short Course');
        const lc=pbs.filter(([,r])=>r.course!=='SC'&&r.course!=='Short Course');
        if(!pbs.length) return '<p style="color:var(--gray-400);font-size:.88rem">No timed results recorded yet.</p>';
        const grid = (arr) => arr.map(([ev,r])=>`
          <div class="pb-card">
            <div class="pb-event">${r.dist}m ${ab(r.stroke)} · ${r.course}</div>
            <div style="display:flex;align-items:center;gap:2px;margin:4px 0 2px;flex-wrap:wrap">
              <span class="pb-time">${r.time_str}</span>
              ${(r.course==='SC'||r.course==='Short Course')?levelBadge(getStdLevel(r.time_sec, isBoy, info.age||r.age, r.stroke, r.dist)):''}
            </div>
            <div class="pb-ctx">${r.comp.length>38?r.comp.slice(0,36)+'…':r.comp}</div>
          </div>`).join('');
        return (sc.length?`<div style="margin-bottom:14px"><div style="font-size:.75rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Short Course (SC)</div><div class="pb-grid">${grid(sc)}</div></div>`:'')

// ── RECORDS ────────────────────────────────────────────────
function renderRecords() {
  if(!dataLoaded){ document.getElementById('c-records').innerHTML = syncFailed?errorBox():loadingBox(); return; }
  const stroke=document.getElementById('f-stroke')?.value||'';
  const course=document.getElementById('f-course')?.value||'';
  const div=document.getElementById('f-div')?.value||'';
  const db=dbMap();
  const rec={};
  ALL.forEach(r=>{
    if(!r.time_sec) return;
    if(!onRoster(r.name)) return;
    if(stroke && r.stroke!==stroke) return;
    if(course && r.course!==course && !(course==='LC'&&r.course==='Long Course')) return;
    const swimDiv=(db[r.name]?.div||r.div||'');
    if(div && swimDiv!==div) return;
    const k=`${r.dist}m ${r.stroke} (${r.course})`;
    if(!rec[k]||r.time_sec<rec[k].time_sec) rec[k]={...r,swimDiv};
  });
  const rows=Object.entries(rec).sort((a,b)=>a[1].dist-b[1].dist||a[1].stroke.localeCompare(b[1].stroke));
  document.getElementById('cnt-records').textContent=rows.length+' Record'+(rows.length!==1?'s':'');
  
  // populate stroke filter
  const sf=document.getElementById('f-stroke');
  if(sf && sf.options.length<=1) {
    [...new Set(ALL.map(r=>r.stroke).filter(Boolean))].sort().forEach(s=>sf.add(new Option(s,s)));
  }
  
  if(!rows.length){ document.getElementById('c-records').innerHTML='<div class="empty"><div class="empty-icon">🏆</div><p>No records match the selected filters.</p></div>'; return; }
  document.getElementById('c-records').innerHTML=`<div class="tbl-wrap"><table class="data-tbl">
    <thead><tr><th>Event</th><th>Time</th><th>Swimmer</th><th>Division</th><th>Date</th><th>Competition</th></tr></thead>
    <tbody>${rows.map(([ev,r])=>`<tr>
      <td><strong>${ev}</strong></td>
      <td class="time-val">${r.time_str}</td>
      <td>${r.name}</td>
      <td>${divBdg(r.swimDiv)}</td>
      <td>${fd(r.date)}</td>
      <td style="font-size:.82rem;color:var(--gray-600)">${r.comp}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

// ── MEDALS ─────────────────────────────────────────────────
function renderMedals() {
  if(!dataLoaded){ document.getElementById('c-medals').innerHTML = syncFailed?errorBox():loadingBox(); return; }
  const divF=document.getElementById('f-medals-div')?.value||'';
  const partF=document.getElementById('f-medals-part')?.value||'';
  const db=dbMap();
  const m={};
  seasonData().forEach(r=>{
    if(!r.medal) return;
    if(!onRoster(r.name)) return;
    const swimDiv=db[r.name]?.div||r.div||'';
    if(divF && swimDiv!==divF) return;
    if(partF && r.part!==partF) return;
    if(!m[r.name]) m[r.name]={div:swimDiv,g:0,s:0,b:0,comps:new Set()};
    if(r.medal==='Gold')m[r.name].g++; else if(r.medal==='Silver')m[r.name].s++; else if(r.medal==='Bronze')m[r.name].b++;
    m[r.name].comps.add(r.comp);
  });
  seasonRelays().forEach(r=>{
    if(!r.medal) return;
    [r.m1,r.m2,r.m3,r.m4].filter(Boolean).forEach(n=>{
      if(!onRoster(n)) return;
      const swimDiv=db[n]?.div||'';
      if(divF && swimDiv!==divF) return;
      if(!m[n]) m[n]={div:swimDiv,g:0,s:0,b:0,comps:new Set()};
      if(r.medal==='Gold')m[n].g++; else if(r.medal==='Silver')m[n].s++; else if(r.medal==='Bronze')m[n].b++;
      m[n].comps.add(r.comp);
    });
  });

  // Sort by total medals (Gold weighted heaviest), then gold, silver, bronze
  const sortFn = (a,b) => {
    const ta=a[1].g+a[1].s+a[1].b, tb=b[1].g+b[1].s+b[1].b;
    if(tb!==ta) return tb-ta;
    if(b[1].g!==a[1].g) return b[1].g-a[1].g;
    if(b[1].s!==a[1].s) return b[1].s-a[1].s;
    return b[1].b-a[1].b;
  };

  const all=Object.entries(m).sort(sortFn);
  document.getElementById('cnt-medals').textContent=all.length+' Swimmer'+(all.length!==1?'s':'');
  if(!all.length){ document.getElementById('c-medals').innerHTML='<div class="empty"><div class="empty-icon">🥇</div><p>No medals match the selected filters.</p></div>'; return; }

  const renderRow=(n,d,i)=>{
    const tot=d.g+d.s+d.b;
    const rankColor=i===0?'var(--gold)':i===1?'#94a3b8':i===2?'#cd7f32':'var(--gray-300)';
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--gray-100)">
      <div style="font-size:1.1rem;font-weight:700;color:${rankColor};min-width:28px;text-align:center">#${i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:var(--navy);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n}</div>
        <div style="font-size:.72rem;color:var(--gray-400);margin-top:1px">${tot} medal${tot!==1?'s':''}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;font-size:.78rem;font-weight:700">
        ${d.g?`<span style="background:var(--gold-lt);color:#92400e;padding:2px 7px;border-radius:6px">🥇${d.g}</span>`:''}
        ${d.s?`<span style="background:var(--gray-100);color:#475569;padding:2px 7px;border-radius:6px">🥈${d.s}</span>`:''}
        ${d.b?`<span style="background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px">🥉${d.b}</span>`:''}
      </div>
    </div>`;
  };

  const renderGroup=(entries,label,accent)=>`
    <div style="flex:1;min-width:280px">
      <div style="font-size:.78rem;font-weight:700;color:${accent};text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;background:var(--gray-50);border-bottom:2px solid var(--gray-100)">${label}</div>
      ${entries.length
        ? entries.map(([n,d],i)=>renderRow(n,d,i)).join('')
        : '<div style="padding:20px;text-align:center;color:var(--gray-400);font-size:.88rem">No medals yet</div>'}
    </div>`;

  const el=document.getElementById('c-medals');
  if(divF) {
    el.innerHTML=`<div style="border:1px solid var(--gray-200);border-radius:10px;overflow:hidden">${renderGroup(all, divF==='Elementary'?'🔵 Elementary':'🟡 Secondary', divF==='Elementary'?'#1e40af':'#92400e')}</div>`;
  } else {
    const elem=all.filter(([,d])=>d.div==='Elementary').sort(sortFn);
    const sec=all.filter(([,d])=>d.div==='Secondary').sort(sortFn);
    el.innerHTML=`<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:280px;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden">${renderGroup(elem,'🔵 Elementary','#1e40af')}</div>
      <div style="flex:1;min-width:280px;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden">${renderGroup(sec,'🟡 Secondary','#92400e')}</div>
    </div>`;
  }
}

// ── RELAY BUILDER ──────────────────────────────────────────
function renderRelayBuilder() {
  const db=dbMap();
  const best={};
  seasonData().forEach(r=>{
    if(!r.time_sec||!r.dist||!r.stroke) return;
    if(r.dist!==50&&r.dist!==100) return;
    const k=`${r.stroke}_${r.dist}`;
    if(!best[k]) best[k]={};
    if(!best[k][r.name]||r.time_sec<best[k][r.name].time_sec) best[k][r.name]=r;
  });
  Object.keys(best).forEach(k=>{ best[k]=Object.values(best[k]).sort((a,b)=>a.time_sec-b.time_sec); });
  const divMap={};
  DB.forEach(d=>{ if(d.name&&d.div) divMap[d.name]=d.div; });
  seasonData().forEach(r=>{ if(r.name&&r.div&&!divMap[r.name]) divMap[r.name]=r.div; });
  const types=[
    {label:'4 × 50m Medley',   dist:50,  strokes:['Backstroke','Breaststroke','Butterfly','Freestyle']},
    {label:'4 × 100m Medley',  dist:100, strokes:['Backstroke','Breaststroke','Butterfly','Freestyle']},
    {label:'4 × 50m Freestyle', dist:50,  strokes:['Freestyle','Freestyle','Freestyle','Freestyle']},
    {label:'4 × 100m Freestyle',dist:100, strokes:['Freestyle','Freestyle','Freestyle','Freestyle']},
  ];
  function buildDiv(divName) {
    let h=`<div style="margin-bottom:24px"><h3 style="font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--teal-lt)">${divName}</h3>`;
    types.forEach(rt=>{
      const used=new Set(), legs=[];
      rt.strokes.forEach(stroke=>{
        const cands=(best[`${stroke}_${rt.dist}`]||[]).filter(r=>divMap[r.name]===divName);
        const pick=cands.find(r=>!used.has(r.name))||null;
        if(pick) used.add(pick.name);
        legs.push({stroke,r:pick});
      });
      const total=legs.reduce((s,l)=>s+(l.r?.time_sec||0),0);
      const full=legs.every(l=>l.r);
      h+=`<div style="margin-bottom:14px;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden">
        <div style="padding:12px 16px;background:var(--gray-50);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span style="font-weight:600;color:var(--navy)">${rt.label}</span>
          ${full?`<span class="bdg bdg-teal">Projected ${ft(total)}</span>`:''}
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0">
          ${legs.map((l,i)=>`
          <div style="padding:12px;border-right:${i<3?'1px solid var(--gray-100)':'none'};text-align:center">
            <div style="font-size:.7rem;color:var(--gray-400);font-weight:600;text-transform:uppercase;margin-bottom:4px">Leg ${i+1} · ${ab(l.stroke)}</div>
            <div style="font-weight:600;color:var(--navy);font-size:.88rem">${l.r?l.r.name:'—'}</div>
            <div style="font-size:.8rem;color:var(--teal);font-weight:600;margin-top:2px">${l.r?l.r.time_str:''}</div>
          </div>`).join('')}
        </div>
      </div>`;
    });
    return h+'</div>';
  }
  document.getElementById('c-relay').innerHTML=
    `<p style="color:var(--gray-600);font-size:.88rem;margin-bottom:20px">Best possible relay teams built from each swimmer's fastest individual time. Each swimmer is used once per relay.</p>`+
    buildDiv('Elementary')+buildDiv('Secondary');
}

// ── PROGRESS ───────────────────────────────────────────────────────────────
function renderProgress() {
  const name     = (document.getElementById('prog-search-val')||{}).value || '';
  const strokeF  = document.getElementById('prog-stroke')?.value || '';
  const distF    = document.getElementById('prog-dist')?.value || '';
  const courseF  = document.getElementById('prog-course')?.value || '';
  const el       = document.getElementById('c-progress');

  if (!dataLoaded) { el.innerHTML = syncFailed?errorBox():loadingBox(); document.getElementById('cnt-progress').textContent='—'; return; }
  if (!name) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">👆</div><p>Search for a swimmer above to view their progress.</p></div>';
    document.getElementById('cnt-progress').textContent = '—';
    return;
  }

  // ALL data, no season filter
  const races = ALL.filter(r => r.name===name && r.time_sec && r.dist && r.stroke && r.date);

  // Repopulate stroke filter from this swimmer's data
  const strSel = document.getElementById('prog-stroke');
  const dstSel = document.getElementById('prog-dist');
  const prevStr = strSel.value, prevDst = dstSel.value;
  strSel.innerHTML = '<option value="">All Strokes</option>';
  dstSel.innerHTML = '<option value="">All Distances</option>';
  [...new Set(races.map(r=>r.stroke).filter(Boolean))].sort()
    .forEach(s=>{ const o=document.createElement('option'); o.value=o.textContent=s; strSel.appendChild(o); });
  [...new Set(races.map(r=>r.dist).filter(Boolean))].sort((a,b)=>a-b)
    .forEach(d=>{ const o=document.createElement('option'); o.value=o.textContent=d; dstSel.appendChild(o); });
  if (prevStr) strSel.value = prevStr;
  if (prevDst) dstSel.value = prevDst;

  // Filter
  let filtered = races;
  if (strokeF) filtered = filtered.filter(r=>r.stroke===strokeF);
  if (distF)   filtered = filtered.filter(r=>String(r.dist)===String(distF));
  if (courseF==='SC') filtered = filtered.filter(r=>r.course==='SC'||r.course==='Short Course');
  else if (courseF==='LC') filtered = filtered.filter(r=>r.course!=='SC'&&r.course!=='Short Course');

  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🏊</div><p>No results match the selected filters.</p></div>';
    document.getElementById('cnt-progress').textContent = '0 swims';
    return;
  }

  // Group by event (stroke + dist + course)
  const byEvent = {};
  filtered.forEach(r => {
    const k = `${r.dist}m ${r.stroke} (${r.course})`;
    if (!byEvent[k]) byEvent[k] = [];
    byEvent[k].push(r);
  });
  Object.values(byEvent).forEach(arr => arr.sort((a,b)=>new Date(a.date)-new Date(b.date)));

  const totalSwims = filtered.length;
  document.getElementById('cnt-progress').textContent = `${totalSwims} swim${totalSwims!==1?'s':''}`;

  const db = dbMap();
  const info = db[name] || {};
  const isBoy = !(info.gender==='Girl'||info.gender==='Female');
  const CHART_COLORS = ['#0891B2','#F59E0B','#10B981','#8B5CF6','#EF4444','#F97316','#06B6D4','#84CC16'];

  // Destroy old charts first to avoid canvas reuse errors
  if (window._progCharts) window._progCharts.forEach(ch=>{ try{ch.destroy();}catch(e){} });
  window._progCharts = [];

  el.innerHTML = Object.entries(byEvent).map(([evLabel, evRaces], ei) => {
    const first = evRaces[0].time_sec;
    const last  = evRaces[evRaces.length-1].time_sec;
    const diff  = first - last;
    const pct   = ((Math.abs(diff)/first)*100).toFixed(1);
    const improved = diff > 0;
    const canvasId = `prog-chart-${ei}`;
    const best = evRaces.reduce((b,r)=>r.time_sec<b.time_sec?r:b, evRaces[0]);
    const isScEvent = best.course==='SC'||best.course==='Short Course';
    const lv = isScEvent ? getStdLevel(best.time_sec, isBoy, info.age||best.age, best.stroke, best.dist) : null;

    return `<div style="margin-bottom:32px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
          <span style="font-weight:700;color:var(--navy);font-size:1rem">${evLabel}</span>
          ${lv ? levelBadge(lv) : ''}
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="font-size:.82rem;color:var(--gray-600)">${evRaces.length} swim${evRaces.length!==1?'s':''}</span>
          <span style="font-size:.82rem;font-weight:700;color:var(--navy)">PB: ${ft(best.time_sec)}</span>
          ${evRaces.length>1?`<span style="font-size:.82rem;font-weight:700;padding:3px 9px;border-radius:8px;background:${improved?'var(--green-lt)':'var(--red-lt)'};color:${improved?'var(--green)':'var(--red)'}">${improved?'▼':'▲'} ${Math.abs(diff).toFixed(2)}s (${pct}%)</span>`:''}
        </div>
      </div>
      <div style="position:relative;height:220px;background:var(--gray-50);border-radius:10px;padding:10px">
        <canvas id="${canvasId}"></canvas>
      </div>
      <div style="margin-top:8px;overflow-x:auto">
        <table class="event-table" style="font-size:.78rem">
          <thead><tr><th>Date</th><th>Competition</th><th>Time</th><th>Δ Prev</th>${isScEvent?'<th>Level</th>':''}</tr></thead>
          <tbody>${evRaces.map((r,i)=>{
            const prev=i>0?evRaces[i-1].time_sec:null;
            const delta=prev?(r.time_sec-prev):null;
            const rl=isScEvent?getStdLevel(r.time_sec,isBoy,info.age||r.age,r.stroke,r.dist):null;
            const isBest=r===best;
            return `<tr${isBest?' style="background:var(--teal-lt)"':''}>
              <td>${fd(r.date)}</td>
              <td style="font-size:.74rem;color:var(--gray-600)">${r.comp.length>32?r.comp.slice(0,30)+'…':r.comp}</td>
              <td class="time-val">${r.time_str}${isBest?' ⭐':''}</td>
              <td style="font-weight:600;color:${delta===null?'var(--gray-400)':delta<0?'var(--green)':delta>0?'var(--red)':'var(--gray-400)'}">${delta===null?'—':(delta<0?'▼ ':'▲ ')+Math.abs(delta).toFixed(2)+'s'}</td>
              ${isScEvent?`<td>${rl?levelBadge(rl):''}</td>`:''}
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }).join('<hr style="border:none;border-top:2px solid var(--gray-100);margin:24px 0">');

  // Render charts
  setTimeout(() => {
    Object.entries(byEvent).forEach(([evLabel, evRaces], ei) => {
      const canvas = document.getElementById(`prog-chart-${ei}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const color = CHART_COLORS[ei % CHART_COLORS.length];
      const labels = evRaces.map(r=>fd(r.date));
      const vals   = evRaces.map(r=>r.time_sec);
      const bestV  = Math.min(...vals);
      const ch = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: evLabel,
            data: vals,
            borderColor: color,
            backgroundColor: color+'22',
            borderWidth: 2.5,
            pointRadius: vals.map(v=>v===bestV?7:5),
            pointHoverRadius: 8,
            pointBackgroundColor: vals.map(v=>v===bestV?color:'#fff'),
            pointBorderColor: color,
            pointBorderWidth: 2,
            tension: 0.3,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              reverse: true,
              ticks: { callback: v=>ft(v), font:{size:11} },
              grid: { color:'#E2E8F0' }
            },
            x: {
              ticks: { font:{size:10}, maxRotation:35, maxTicksLimit:8 },
              grid: { display:false }
            }
          },
          plugins: {
            legend: { display:false },
            tooltip: {
              callbacks: {
                label: ctx=>`  ${ft(ctx.parsed.y)}${ctx.parsed.y===bestV?' ⭐ PB':''}`
              }
            }
          }
        }
      });
      window._progCharts.push(ch);
    });
  }, 50);
}

// Progress swimmer search
function initProgSearch() {
  const inp = document.getElementById('prog-search');
  const res = document.getElementById('prog-search-results');
  const val = document.getElementById('prog-search-val');
  if (!inp) return;
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    res.innerHTML = '';
    res.style.display = 'none';
    if (!q) { val.value=''; renderProgress(); return; }
    const matches=ROSTER_LIST().filter(n=>n.toLowerCase().includes(q)).slice(0,8);
    if (!matches.length) return;
    res.style.display = 'block';
    matches.forEach(n => {
      const d = document.createElement('div');
      d.textContent = n;
      d.style.cssText = 'padding:8px 14px;cursor:pointer;font-size:.9rem;border-bottom:1px solid var(--gray-100)';
      d.onmousedown = () => {
        inp.value = n; val.value = n;
        res.style.display = 'none';
        // Reset stroke/dist filters for new swimmer
        document.getElementById('prog-stroke').innerHTML = '<option value="">All Strokes</option>';
        document.getElementById('prog-dist').innerHTML = '<option value="">All Distances</option>';
        renderProgress();
      };
      res.appendChild(d);
    });
  });
  inp.addEventListener('blur', () => setTimeout(()=>res.style.display='none', 150));
  inp.addEventListener('focus', () => { if (inp.value) inp.dispatchEvent(new Event('input')); });
}


function renderRelayResults() {
  if(!dataLoaded){ document.getElementById('c-relays').innerHTML = syncFailed?errorBox():loadingBox(); return; }
  const sorted=[...seasonRelays()].filter(r=>[r.m1,r.m2,r.m3,r.m4].some(onRoster))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('cnt-relays').textContent=sorted.length+' Relay'+(sorted.length!==1?'s':'');
  if(!sorted.length){ document.getElementById('c-relays').innerHTML='<div class="empty"><div class="empty-icon">🔄</div><p>No relay results yet.</p></div>'; return; }

  // Group by competition
  const byComp = {};
  sorted.forEach(r=>{
    if(!byComp[r.comp]) byComp[r.comp]={date:r.date,venue:r.venue,course:r.course,relays:[]};
    byComp[r.comp].relays.push(r);
  });
  const comps = Object.entries(byComp).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date));

  document.getElementById('c-relays').innerHTML = comps.map(([cname,cd],ci)=>{
    const totalMedals = cd.relays.filter(r=>r.medal).length;
    return `<div class="comp-block ${ci===0?'open':''}" id="rcomp-${ci}">
      <div class="comp-block-head" onclick="toggleComp(this.parentElement)">
        <div>
          <div class="comp-block-name">${cname}</div>
          <div class="comp-block-meta">${fd(cd.date)}${cd.venue?' · '+cd.venue:''} · ${cd.course}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:.82rem;color:var(--gray-600)">${cd.relays.length} relay${cd.relays.length!==1?'s':''}</span>
          ${totalMedals?`<span style="font-size:.88rem">${cd.relays.filter(r=>r.medal==='Gold').map(()=>'🥇').join('')}${cd.relays.filter(r=>r.medal==='Silver').map(()=>'🥈').join('')}${cd.relays.filter(r=>r.medal==='Bronze').map(()=>'🥉').join('')}</span>`:''}
          <span class="comp-toggle">▼</span>
        </div>
      </div>
      <div class="comp-block-body">
        ${cd.relays.map(r=>{
          const legs=[[r.m1,r.s1,r.sp1],[r.m2,r.s2,r.sp2],[r.m3,r.s3,r.sp3],[r.m4,r.s4,r.sp4]].filter(l=>l[0]);
          return `<div style="margin-bottom:16px;padding:14px;background:var(--gray-50);border-radius:10px;border:1px solid var(--gray-200)">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
              <span style="font-weight:700;color:var(--navy);font-size:.95rem">${r.event}</span>
              <div style="display:flex;gap:8px;align-items:center">
                ${r.time?`<span style="font-weight:700;color:var(--navy)">${r.time}</span>`:''}
                ${medalBdg(r.medal)}
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px">
              ${legs.map((l,i)=>`<div style="background:#fff;border-radius:7px;padding:8px 10px;border:1px solid var(--gray-100)">
                <div style="font-size:.68rem;color:var(--gray-400);font-weight:600;margin-bottom:2px">LEG ${i+1} · ${ab(l[1])}</div>
                <div style="font-weight:600;color:var(--navy);font-size:.85rem">${l[0]}</div>
                ${l[2]?`<div style="color:var(--teal);font-size:.77rem;font-weight:600;margin-top:2px">${l[2]}</div>`:''}
              </div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}


// ── COMPETITIONS ───────────────────────────────────────────
function renderComps() {
  if(!dataLoaded){ document.getElementById('c-comps').innerHTML = syncFailed?errorBox():loadingBox(); return; }
  const m={};
  seasonData().forEach(r=>{
    if(!onRoster(r.name)) return;
    if(!m[r.comp]) m[r.comp]={date:r.date,venue:r.venue,course:r.course,part:r.part,rows:[]};
    m[r.comp].rows.push(r);
  });
  const sorted=Object.entries(m).sort((a,b)=>new Date(b[1].date)-new Date(a[1].date));
  document.getElementById('cnt-comps').textContent=sorted.length+' Competition'+(sorted.length!==1?'s':'');
  if(!sorted.length){ document.getElementById('c-comps').innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>No competition data yet.</p></div>'; return; }

  document.getElementById('c-comps').innerHTML=sorted.map(([cname,cd],ci)=>{
    const rows=cd.rows;
    const swimmers=[...new Set(rows.map(r=>r.name))].sort();
    // only relays involving a current roster swimmer
    const relHere=seasonRelays().filter(r=>r.comp===cname && [r.m1,r.m2,r.m3,r.m4].some(onRoster));
    const g=rows.filter(r=>r.medal==='Gold').length;
    const sv=rows.filter(r=>r.medal==='Silver').length;
    const b=rows.filter(r=>r.medal==='Bronze').length;
    const tot=g+sv+b;
    // per-swimmer breakdown
    const bySwimmer={};
    rows.forEach(r=>{
      if(!bySwimmer[r.name]) bySwimmer[r.name]=[];
      bySwimmer[r.name].push(r);
    });
    return `<div class="comp-block" id="comp-${ci}">
      <div class="comp-block-head" onclick="toggleComp(this.parentElement)">
        <div>
          <div class="comp-block-name">${cname}</div>
          <div class="comp-block-meta">${fd(cd.date)}${cd.venue?' · '+cd.venue:''} · ${cd.course} · ${cd.part||''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="font-size:.82rem;color:var(--gray-600)">${swimmers.length} swimmer${swimmers.length!==1?'s':''}</span>
          ${tot?`<span style="font-size:.88rem">${'🥇'.repeat(g)}${'🥈'.repeat(sv)}${'🥉'.repeat(b)}</span>`:''}
          <span class="comp-toggle">▼</span>
        </div>
      </div>
      <div class="comp-block-body">
        ${swimmers.map(n=>{
          const srows=bySwimmer[n];
          const sg=srows.filter(r=>r.medal==='Gold').length;
          const ss=srows.filter(r=>r.medal==='Silver').length;
          const sb=srows.filter(r=>r.medal==='Bronze').length;
          const srel=relHere.filter(r=>[r.m1,r.m2,r.m3,r.m4].includes(n));
          return `<div style="margin-bottom:14px">
            <div style="font-weight:600;color:var(--navy);font-size:.9rem;margin-bottom:6px;display:flex;align-items:center;gap:8px">
              ${n}
              ${sg||ss||sb?`<span style="font-size:.85rem">${'🥇'.repeat(sg)}${'🥈'.repeat(ss)}${'🥉'.repeat(sb)}</span>`:''}
            </div>
            <table class="event-table">
              <thead><tr><th>Event</th><th>Time</th><th>Rank</th><th>Medal</th></tr></thead>
              <tbody>
                ${srows.map(r=>`<tr>
                  <td>${r.dist?r.dist+'m ':r.stroke?'':''}${r.stroke}</td>
                  <td class="time-val">${r.time_str||'—'}</td>
                  <td>${r.rank||'—'}</td>
                  <td>${medalBdg(r.medal)}</td>
                </tr>`).join('')}
                ${srel.map(r=>`<tr class="relay-row">
                  <td><span class="relay-label">RELAY</span>${r.event}</td>
                  <td class="time-val">${r.time||'—'}</td>
                  <td>${r.rank||'—'}</td>
                  <td>${medalBdg(r.medal)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
        }).join('<hr style="border:none;border-top:1px solid var(--gray-100);margin:10px 0">')}
        ${relHere.length?`<div style="margin-top:10px;padding-top:10px;border-top:2px solid var(--teal-lt)">
          <div style="font-size:.75rem;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">🤝 Relay Results</div>
          ${relHere.map(r=>{
            const legs=[[r.m1,r.s1,r.sp1],[r.m2,r.s2,r.sp2],[r.m3,r.s3,r.sp3],[r.m4,r.s4,r.sp4]].filter(l=>l[0]);
            return `<div style="margin-bottom:8px;padding:10px;background:var(--teal-lt);border-radius:8px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-weight:600;color:var(--navy);font-size:.88rem">${r.event}</span>
                <div style="display:flex;gap:6px;align-items:center">
                  ${r.time?`<span style="font-weight:700;color:var(--navy)">${r.time}</span>`:''}
                  ${medalBdg(r.medal)}
                </div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                ${legs.map((l,i)=>`<span style="font-size:.75rem;background:#fff;padding:3px 8px;border-radius:6px;color:var(--gray-600)">Leg ${i+1}: <strong>${l[0]}</strong>${l[2]?' ('+l[2]+')':''}</span>`).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}
